<div class=c><b>Klasyfikacja generalna GP</b><div class=mu>Linia: Nazwisko punkty (np. Zmarzlik 45). Puste pole = liczenie automatycznie z wpisanych rund.</div><textarea id=xG rows=6>${esc((S.d.season.gc||[]).map(x=>x.n+' '+x.p).join('\n'))}</textarea><button class=a onclick="xg()">Zapisz klasyfikację</button></div>
<div class=c><b>Sezon</b><textarea id=xT rows=2 placeholder="Drużyny (8) po przecinku">${esc((s.teams||[]).join(', '))}</textarea><textarea id=xR rows=2 placeholder="Zawodnicy MŚ po przecinku">${esc((s.riders||SEED).join(', '))}</textarea><button class=a onclick="xs()">Zapisz listy</button>
<div class=mu style="margin-top:8px">Wyniki końcowe (na koniec sezonu): tabela 1–8, mistrz, MŚ 1–3 po przecinku</div><textarea id=xF1 rows=2>${esc((s.fin?s.fin.t:[]).join(', '))}</textarea><input id=xF2 placeholder="Mistrz Polski" value="${esc(s.fin?s.fin.c:'')}"><textarea id=xF3 rows=1>${esc((s.fin?s.fin.w:[]).join(', '))}</textarea><button class=a onclick="xf()">Zapisz wyniki sezonu</button></div>
<div class=c><b>Czyszczenie danych</b><div class=mu>Operacje nieodwracalne.</div><button class=a style="background:#c0392b" onclick="xw(1)">Wyczyść typy ZIBI i MATI</button><button class=a style="background:#c0392b" onclick="xw(2)">Wyczyść wyniki rund, meczów i sezonu</button><button class=a style="background:#c0392b" onclick="xw(3)">Reset całego sezonu 2027</button></div>`}
const ml=v=>v.split(/[,\n]/).map(s=>s.trim()).filter(Boolean);

window.xr=async()=>{const n=$('#xn').value.trim(),d=$('#xt').value;if(!n||!d)return alert('Podaj nazwę i datę');S.d.rounds.push({id:'g'+Math.random().toString(36).slice(2,8),name:n,t:d,b:[[],[],[],[]]});await sd()};
window.xc=async()=>{if(S.d.rounds.length&&!confirm('Dodać kalendarz do istniejących rund?'))return;GPCAL.forEach(([d,n],i)=>S.d.rounds.push({id:'g'+Math.random().toString(36).slice(2,8),name:'R'+String(i+1).padStart(2,'0')+' '+n,t:d+'T18:00',b:[[],[],[],[]]}));await sd()};
window.xk=id=>{const r=ord();[0,1,2,3].forEach(i=>$('#rb'+id+i).value=(i<3?r.slice(i*4,i*4+4):r.slice(12)).join(', '))};
window.xa=async()=>{const r=ord();S.d.rounds.forEach(x=>{if(x.b.every(L=>!L.length))x.b=[0,1,2,3].map(i=>i<3?r.slice(i*4,i*4+4):r.slice(12))});await sd()};
window.xg=async()=>{S.d.season.gc=$('#xG').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/^(.*?)\s+(\d+)$/);return m?{n:m[1],p:+m[2]}:{n:l,p:0}});await sd()};
const wp=async P=>{await ok(()=>setDoc(doc(db,'picks',P),S.p[P]))};
window.xd=async id=>{if(!confirm('Usunąć rundę razem z typami graczy?'))return;S.d.rounds=S.d.rounds.filter(r=>r.id!=id);for(const P of PL)if(S.p[P].g&&S.p[P].g[id]){delete S.p[P].g[id];await wp(P)}delete dr[id];await sd()};
window.xdm=async id=>{if(!confirm('Usunąć mecz razem z typami graczy?'))return;S.d.matches=S.d.matches.filter(m=>m.id!=id);for(const P of PL)if(S.p[P].m&&S.p[P].m[id]){delete S.p[P].m[id];await wp(P)}await sd()};
window.xw=async n=>{if(n==3?prompt('Wpisz USUŃ, aby skasować rundy, mecze, typy i wyniki')!='USUŃ':!confirm('Na pewno wyczyścić?'))return;
if(n==2){S.d.rounds.forEach(r=>delete r.places);S.d.matches.forEach(m=>m.res=null);delete S.d.season.fin;await sd()}
else{PL.forEach(P=>S.p[P]={});dr={};if(n==3)S.d={rounds:[],matches:[],season:{teams:TEAMS,riders:SEED}};for(const P of PL)await wp(P);if(n==3)await sd()}};
window.xu=async id=>{const r=S.d.rounds.find(x=>x.id==id);r.t=$('#rt'+id).value;r.b=[0,1,2,3].map(i=>ml($('#rb'+id+i).value));await sd()};
window.xp=async id=>{const r=S.d.rounds.find(x=>x.id==id),p={};document.querySelectorAll(`input[data-r="${id}"]`).forEach(i=>{if(i.value)p[i.dataset.n]=+i.value});r.places=p;await sd()};
window.xi=async()=>{$('#xm').value.split('\n').forEach((l,i)=>{const[a,h,g,n]=l.split(';').map(s=>s.trim());if(a&&h&&g)S.d.matches.push({id:'m'+Date.now()+i,t:a.replace(' ','T'),h,a:g,n})});await sd()};
window.xe=async id=>{const m=S.d.matches.find(x=>x.id==id);m.t=$('#d'+id).value;const h=$('#rh'+id).value,a=$('#ra'+id).value;m.res=h!==''&&a!==''?{h:+h,a:+a}:null;await sd()};
window.xs=async()=>{S.d.season={...S.d.season,teams:ml($('#xT').value),riders:ml($('#xR').value)};await sd()};
window.xf=async()=>{S.d.season.fin={t:ml($('#xF1').value),c:$('#xF2').value.trim(),w:ml($('#xF3').value)};await sd()};
</script></body></html>
